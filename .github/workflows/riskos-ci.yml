name: RiskOS CI

on:
  push:
    paths:
      - "riskos/**"
      - ".github/workflows/riskos-ci.yml"
  pull_request:
    paths:
      - "riskos/**"
      - ".github/workflows/riskos-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        working-directory: riskos
        run: python -m unittest discover -s tests -v

      - name: Run synthetic decision demo
        working-directory: riskos
        run: python -m riskos.demo

      - name: Run threshold optimization
        working-directory: riskos
        run: python -m riskos.evaluation

      - name: Compile dashboard
        working-directory: riskos
        run: python -m py_compile dashboard/app.py
